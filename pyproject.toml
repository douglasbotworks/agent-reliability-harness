[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-harness"
version = "0.1.0"
description = "A local CLI for evaluating and comparing labeled agent runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
agent-reliability = "agent_reliability.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]
